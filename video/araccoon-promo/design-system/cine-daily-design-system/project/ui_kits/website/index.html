<!-- @dsCard group="Website" viewport="1280x800" name="Cine Daily — film feature page" subtitle="Dark hero → production → light story + booking → in theaters" -->
<!doctype html><html><head><meta charset="utf-8"><title>Cine Daily — Feature</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script src="./image-slot.js"></script>
<style>body{margin:0;background:#fff;font-family:var(--font-sans);color:#0a0a0a}*{box-sizing:border-box}a{color:var(--accent)}a:hover{color:var(--accent-hover)}#root{max-width:1280px;margin:0 auto;min-width:1280px}</style></head><body><div id="root"></div>
<script type="text/babel" src="Shared.jsx"></script><script type="text/babel" src="Hero.jsx"></script><script type="text/babel" src="Production.jsx"></script><script type="text/babel" src="Story.jsx"></script><script type="text/babel" src="InTheaters.jsx"></script>
<script type="text/babel">
const IDS = ['hero', 'production', 'story', 'theaters'];
const DARK = { hero: true, production: true };
function App() {
  const { NavBar, Reveal } = DS;
  const [active, setActive] = React.useState(0);
  const [tone, setTone] = React.useState('dark');
  const [stripRed, setStripRed] = React.useState(false);
  const [booked, setBooked] = React.useState(false);
  React.useEffect(() => {
    const onScroll = () => {
      setStripRed(window.scrollY > 80);
      const y = 48;
      IDS.forEach((id, i) => { const r = document.getElementById(id).getBoundingClientRect(); if (r.top <= y && r.bottom > y) { setActive(i); setTone(DARK[id] ? 'dark' : 'light'); } });
    };
    onScroll(); window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  const go = (i) => { const el = document.getElementById(IDS[i]); if (el) window.scrollTo({ top: el.offsetTop + (i === 2 ? 48 : 0), behavior: 'smooth' }); };
  return <main style={{ position: 'relative' }}>
    <div style={{ position: 'fixed', top: 0, left: 'max(0px, calc(50% - 640px))', width: 1280, zIndex: 50 }}>
      <Reveal effect="drop" distance={30} delay={CUE.hero.nav} once><NavBar tone={tone} active={active} onNavigate={go} /></Reveal>
    </div>
    <Hero onBook={() => go(2)} stripRed={stripRed} /><Production /><Story booked={booked} onBooked={() => setBooked(true)} /><InTheaters />
  </main>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
