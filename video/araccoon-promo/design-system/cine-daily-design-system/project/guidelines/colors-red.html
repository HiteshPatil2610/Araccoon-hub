<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);color:var(--text-on-light)}*{box-sizing:border-box}.row{display:flex;gap:10px;padding:20px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px}.chip{height:72px;border-radius:10px;border:1px solid rgba(0,0,0,.08)}.k{color:#5a5a5a;font-size:10px}.lab{font-size:11px;letter-spacing:.32em;text-transform:uppercase}.d{font-family:var(--font-display);line-height:.86}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--cd-red-700)"></div><b>Red 700</b><span class="k">--cd-red-700<br>#8E1520</span></div><div class="sw"><div class="chip" style="background:var(--cd-red-600)"></div><b>Red 600</b><span class="k">--cd-red-600<br>#A81A28</span></div><div class="sw"><div class="chip" style="background:var(--cd-red-500)"></div><b>Red 500 · accent</b><span class="k">--cd-red-500<br>#C8202F</span></div><div class="sw"><div class="chip" style="background:var(--cd-red-400)"></div><b>Red 400</b><span class="k">--cd-red-400<br>#DE3A48</span></div><div class="sw"><div class="chip" style="background:var(--cd-red-300)"></div><b>Red 300</b><span class="k">--cd-red-300<br>#EE7C86</span></div><div class="sw"><div class="chip" style="background:var(--cd-pink-500)"></div><b>Pink edge</b><span class="k">--cd-pink-500<br>#E2457E</span></div></div></body></html>
