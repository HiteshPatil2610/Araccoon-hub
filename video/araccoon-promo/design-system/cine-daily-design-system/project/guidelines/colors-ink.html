<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);color:var(--text-on-light)}*{box-sizing:border-box}.row{display:flex;gap:10px;padding:20px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px}.chip{height:72px;border-radius:10px;border:1px solid rgba(0,0,0,.08)}.k{color:#5a5a5a;font-size:10px}.lab{font-size:11px;letter-spacing:.32em;text-transform:uppercase}.d{font-family:var(--font-display);line-height:.86}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--cd-black)"></div><b>Black</b><span class="k">--cd-black<br>#0A0A0A</span></div><div class="sw"><div class="chip" style="background:var(--cd-ink-900)"></div><b>Ink 900</b><span class="k">--cd-ink-900<br>#121212</span></div><div class="sw"><div class="chip" style="background:var(--cd-ink-800)"></div><b>Ink 800</b><span class="k">--cd-ink-800<br>#1C1C1C</span></div><div class="sw"><div class="chip" style="background:var(--cd-ink-700)"></div><b>Ink 700 · card</b><span class="k">--cd-ink-700<br>#2A2A2A</span></div><div class="sw"><div class="chip" style="background:var(--cd-ink-600)"></div><b>Ink 600</b><span class="k">--cd-ink-600<br>#3A3A3A</span></div><div class="sw"><div class="chip" style="background:var(--cd-ink-500)"></div><b>Ink 500</b><span class="k">--cd-ink-500<br>#5A5A5A</span></div></div></body></html>
