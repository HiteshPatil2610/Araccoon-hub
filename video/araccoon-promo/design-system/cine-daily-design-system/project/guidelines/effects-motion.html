<!-- @dsCard group="Motion" viewport="700x170" name="Easing" subtitle="--ease-cine for moves, --ease-pop for discs & stickers" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);background:#fff;overflow:hidden}*{box-sizing:border-box}.k{font-size:10px;color:#5a5a5a}.d{font-family:var(--font-display);line-height:.86}</style><style>@keyframes mv{0%,12%{transform:translateX(0)}50%,62%{transform:translateX(480px)}100%{transform:translateX(0)}}.t{height:40px;position:relative;border-top:var(--hairline);display:flex;align-items:center}.dot{width:34px;height:34px;border-radius:50%;animation:mv 3.4s infinite}</style></head><body><div style="padding:20px 24px;display:flex;flex-direction:column;gap:14px">
<div class="t"><div class="dot" style="background:var(--accent);animation-timing-function:var(--ease-cine)"></div><span class="k" style="position:absolute;right:0">--ease-cine · cubic-bezier(.7,0,.2,1)</span></div>
<div class="t"><div class="dot" style="background:#0a0a0a;animation-timing-function:var(--ease-pop)"></div><span class="k" style="position:absolute;right:0">--ease-pop · cubic-bezier(.34,1.45,.55,1)</span></div>
<span class="k">--dur-fast 160 · --dur-base 320 · --dur-slow 700 · --dur-reveal 1100 · --dur-tracking 1300 · --stagger-step 120</span></div></body></html>
