<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Light scale + desk frame" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);color:var(--text-on-light)}*{box-sizing:border-box}.row{display:flex;gap:10px;padding:20px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px}.chip{height:72px;border-radius:10px;border:1px solid rgba(0,0,0,.08)}.k{color:#5a5a5a;font-size:10px}.lab{font-size:11px;letter-spacing:.32em;text-transform:uppercase}.d{font-family:var(--font-display);line-height:.86}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--cd-white)"></div><b>White</b><span class="k">--cd-white<br>#FFFFFF</span></div><div class="sw"><div class="chip" style="background:var(--cd-gray-100)"></div><b>Gray 100</b><span class="k">--cd-gray-100<br>#EDEDED</span></div><div class="sw"><div class="chip" style="background:var(--cd-gray-200)"></div><b>Gray 200</b><span class="k">--cd-gray-200<br>#DADADA</span></div><div class="sw"><div class="chip" style="background:var(--cd-gray-300)"></div><b>Gray 300</b><span class="k">--cd-gray-300<br>#B5B5B5</span></div><div class="sw"><div class="chip" style="background:var(--cd-gray-400)"></div><b>Gray 400</b><span class="k">--cd-gray-400<br>#8C8C8C</span></div><div class="sw"><div class="chip" style="background:var(--cd-frame)"></div><b>Desk frame</b><span class="k">--cd-frame<br>#CEC7C4</span></div></div></body></html>
