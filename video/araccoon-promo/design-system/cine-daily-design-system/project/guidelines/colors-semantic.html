<!-- @dsCard group="Colors" viewport="700x170" name="Semantic surfaces" subtitle="Dark hero vs. light editorial" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);color:var(--text-on-light)}*{box-sizing:border-box}.row{display:flex;gap:10px;padding:20px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px}.chip{height:72px;border-radius:10px;border:1px solid rgba(0,0,0,.08)}.k{color:#5a5a5a;font-size:10px}.lab{font-size:11px;letter-spacing:.32em;text-transform:uppercase}.d{font-family:var(--font-display);line-height:.86}</style></head><body><div class="row" style="gap:14px"><div style="flex:1;background:var(--surface-dark);color:var(--text-on-dark);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px"><span class="lab" style="color:var(--text-on-dark-muted)">surface-dark</span><span class="d" style="font-size:40px">Text on dark</span><span style="display:flex;gap:6px"><span style="width:28px;height:28px;border-radius:50%;background:var(--accent)"></span><span style="width:28px;height:28px;border-radius:50%;background:var(--surface-card-dark)"></span><span style="width:28px;height:28px;border-radius:50%;border:1px solid var(--outline-on-dark)"></span></span></div><div style="flex:1;background:var(--surface-page);border:1px solid var(--line-on-light);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px"><span class="lab" style="color:var(--text-on-light-muted)">surface-page</span><span class="d" style="font-size:40px">Text on light</span><span style="display:flex;gap:6px"><span style="width:28px;height:28px;border-radius:50%;background:var(--accent)"></span><span style="width:28px;height:28px;border-radius:50%;background:var(--cd-black)"></span><span style="width:28px;height:28px;border-radius:50%;border:1px solid var(--outline-on-light)"></span></span></div></div></body></html>
