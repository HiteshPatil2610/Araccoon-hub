<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);color:var(--text-on-light)}*{box-sizing:border-box}.row{display:flex;gap:10px;padding:20px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px}.chip{height:72px;border-radius:10px;border:1px solid rgba(0,0,0,.08)}.k{color:#5a5a5a;font-size:10px}.lab{font-size:11px;letter-spacing:.32em;text-transform:uppercase}.d{font-family:var(--font-display);line-height:.86}</style></head><body><div class="row" style="gap:30px;padding:30px;background:var(--cd-frame)"><div style="flex:1;height:90px;border-radius:16px;background:#fff;box-shadow:var(--shadow-frame);display:flex;align-items:flex-end;padding:10px"><span class="k" style="color:#5a5a5a">frame</span></div><div style="flex:1;height:90px;border-radius:16px;background:var(--cd-ink-700);box-shadow:var(--shadow-card);display:flex;align-items:flex-end;padding:10px"><span class="k" style="color:#fff">card</span></div><div style="flex:1;height:90px;border-radius:16px;background:var(--cd-red-500);box-shadow:var(--shadow-cutout);display:flex;align-items:flex-end;padding:10px"><span class="k" style="color:#fff">cutout</span></div></div></body></html>
